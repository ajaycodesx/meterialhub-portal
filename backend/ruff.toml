# Lint baseline for the MaterialHub backend.
# Covers real bugs and syntax errors; formatting and style rules are left out.
line-length = 120
target-version = "py311"

[lint]
select = [
    "E4",  # import errors
    "E7",  # statement errors
    "E9",  # runtime errors
    "F",   # pyflakes: unused imports/variables, undefined names
    "B",   # bugbear: likely bugs
]
# FastAPI's Depends(...) and Query(...) in parameter defaults are the framework's idiom.
ignore = ["B008"]
